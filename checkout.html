<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f32"><meta name="description" content="NŪRAN | نوران — مكملات غذائية ورياضية للسوق السعودي."><title>إتمام الطلب | NŪRAN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=DM+Sans:wght@500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="v8.css"><script src="assets/hero.js" defer></script><script src="assets/whey.js" defer></script><script src="assets/creatine.js" defer></script><script src="assets/daily.js" defer></script><script src="assets/omega.js" defer></script><script src="assets/sleep.js" defer></script><script src="assets/hydration.js" defer></script><script src="v5-data.js" defer></script><script src="v8.js" defer></script></head><body data-page="checkout"><div id="siteHeader"></div><main class="page">
<section class="page-hero"><div class="container"><div class="breadcrumbs">الرئيسية / السلة / إتمام الطلب</div><h1>إتمام <em>الطلب.</em></h1><p>واجهة Checkout منفصلة وواضحة، جاهزة للربط ببوابة الدفع ونظام الطلبات عند تجهيز بيانات التاجر.</p></div></section>
<section class="section"><div class="container checkout-layout">
<form class="checkout-form" id="checkoutForm"><span class="eyebrow">DELIVERY DETAILS</span><h2>بيانات التوصيل</h2><div class="form-grid"><label>الاسم الكامل<input name="name" required></label><label>رقم الجوال<input name="phone" inputmode="tel" placeholder="05xxxxxxxx" required></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>المدينة<select name="city" required><option value="">اختر المدينة</option><option>الرياض</option><option>جدة</option><option>مكة المكرمة</option><option>المدينة المنورة</option><option>الدمام</option><option>الخبر</option><option>أخرى</option></select></label><label>الحي<input name="district" required></label><label>الرمز البريدي<input name="postal" inputmode="numeric"></label><label class="full">العنوان التفصيلي<textarea name="address" rows="3" required></textarea></label></div><span class="eyebrow" style="display:block;margin-top:22px">PAYMENT</span><div class="payment-cards"><label><input type="radio" name="payment" value="cod" checked><span><b>الدفع عند الاستلام</b><small>يُفعّل بعد ربط نظام الطلبات</small></span></label><label><input type="radio" name="payment" value="online"><span><b>مدى / Apple Pay / بطاقات</b><small>يحتاج حساب تاجر وبوابة دفع</small></span></label></div><button class="btn primary wide" id="checkoutButton" type="submit" style="margin-top:18px">تأكيد الطلب</button></form>
<aside class="order-summary"><h3>ملخص الطلب</h3><div class="summary-items" id="checkoutItems"></div><div class="summary-totals"><div><span>المنتجات</span><b id="sumProducts"></b></div><div><span>الشحن</span><b id="sumShipping"></b></div><div class="total"><span>الإجمالي</span><b id="sumTotal"></b></div></div></aside>
</div></section></main><div id="siteFooter"></div></body></html>
